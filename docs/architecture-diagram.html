<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vale architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,700;8..60,900&display=swap" />
<style>
  /* Source for architecture-diagram.png (rendered at 1600x1120). Ink & Blue, like the app. */
  html, body { margin: 0; background: #F3F5F8; }
  svg { display: block; }
  .h { font-family: "Source Serif 4", Georgia, serif; font-weight: 900; fill: #1E293B; }
  .h2 { font-family: "Source Serif 4", Georgia, serif; font-weight: 700; fill: #1E293B; }
  .t { font-family: Inter, system-ui, sans-serif; fill: #1E293B; }
  .b { font-family: Inter, system-ui, sans-serif; fill: #1E293B; font-weight: 600; }
  .m { font-family: Inter, system-ui, sans-serif; fill: #64748B; }
  .k { font-family: Inter, system-ui, sans-serif; fill: #1D4ED8; font-weight: 700; letter-spacing: .14em; }
  .w { font-family: Inter, system-ui, sans-serif; fill: #FFFFFF; font-weight: 700; }
  .col { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
  .sub { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
  .hot { fill: #EFF4FF; stroke: #BFD3FE; stroke-width: 1; }
  .svc { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .arrow { stroke: #1D4ED8; stroke-width: 2.2; fill: none; }
  .soft { stroke: #94A3B8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  .num { fill: #1D4ED8; }
  .pill { fill: #FFFFFF; stroke: #BFD3FE; stroke-width: 1.2; }
</style>
</head>
<body>
<svg width="1600" height="1120" viewBox="0 0 1600 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8" />
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- ===== Header ===== -->
  <rect x="40" y="34" width="56" height="56" rx="13" fill="#1E293B" />
  <path d="M56 49 L68 75 L80 49" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="55" y="80" width="26" height="3.5" rx="1.75" fill="#3B82F6" />
  <text x="112" y="72" class="h" font-size="40">Vale</text>
  <rect x="112" y="78" width="25" height="3" rx="1.5" fill="#1D4ED8" />
  <text x="112" y="98" class="m" font-size="14">One calm, finite newspaper a day: made for each student, and smarter after every click, skip and quiz.</text>
  <text x="1560" y="60" text-anchor="end" class="k" font-size="12">ARCHITECTURE</text>
  <text x="1560" y="82" text-anchor="end" class="m" font-size="13">github.com/hammad-cost/personal-morning-paper</text>
  <line x1="40" y1="118" x2="1560" y2="118" stroke="#1D4ED8" stroke-width="3" />

  <!-- Browser talks straight to Supabase Auth and Copilot Cloud -->
  <path d="M430 168 V146 H1370 V168" class="soft" marker-end="url(#g)" />
  <text x="900" y="140" text-anchor="middle" class="m" font-size="12.5">browser → Supabase Auth (email sign-in link) · Copilot Cloud (Editor chat runtime)</text>

  <!-- ===== Column A: the web app ===== -->
  <rect x="40" y="168" width="450" height="682" rx="16" class="col" />
  <text x="62" y="198" class="k" font-size="11">ON EVERY PHONE &amp; LAPTOP</text>
  <text x="62" y="226" class="h2" font-size="24">Web app · Render static site</text>
  <text x="62" y="248" class="m" font-size="13">React 19 · Vite · Tailwind · installable as an app (PWA)</text>

  <rect x="58" y="266" width="414" height="100" rx="10" class="sub" />
  <text x="76" y="292" class="b" font-size="15">1 · Sign in &amp; meet the Editor</text>
  <text x="76" y="315" class="t" font-size="13">Email sign-in link (Supabase) · each student, own paper</text>
  <text x="76" y="335" class="t" font-size="13">"Talk to the Editor" chat (CopilotKit) or Quick setup</text>
  <text x="76" y="355" class="t" font-size="13">Names the paper: THE AYESHA CHRONICLE</text>

  <rect x="58" y="378" width="414" height="140" rx="10" class="hot" />
  <text x="76" y="404" class="b" font-size="15">2 · Instagram-style feed, but finite</text>
  <text x="76" y="427" class="t" font-size="13">10 stories → 🧠 Brain check (3 questions)</text>
  <text x="76" y="447" class="t" font-size="13">→ "More for you" 10 stories → 🧠 Brain check</text>
  <text x="76" y="467" class="t" font-size="13">→ You're all caught up + 3 Things You Learned</text>
  <text x="76" y="487" class="t" font-size="13">♡ like · ✕ skip (undo) · ↗ original · publisher logos</text>
  <text x="76" y="507" class="t" font-size="13">Every story: photo, "why it matters to you", citation</text>

  <rect x="58" y="530" width="414" height="80" rx="10" class="sub" />
  <text x="76" y="556" class="b" font-size="15">3 · Broadsheet view · You page</text>
  <text x="76" y="579" class="t" font-size="13">Same paper as a newspaper grid (toggle)</text>
  <text x="76" y="599" class="t" font-size="13">You: today's numbers, learned interests, 7am email switch</text>

  <rect x="58" y="622" width="414" height="100" rx="10" class="sub" />
  <text x="76" y="648" class="b" font-size="15">4 · AI Editor Desk · Brain · Past editions</text>
  <text x="76" y="671" class="t" font-size="13">Chat that edits today's paper: swap a story,</text>
  <text x="76" y="691" class="t" font-size="13">"more AI, less sport", print the next edition</text>
  <text x="76" y="711" class="t" font-size="13">Brain shows what Vale has learned and why</text>

  <rect x="58" y="734" width="414" height="98" rx="10" class="hot" />
  <text x="76" y="760" class="b" font-size="15">5 · Take it offline</text>
  <text x="76" y="783" class="t" font-size="13">PDF newspaper: branded cover, "Inside today" index,</text>
  <text x="76" y="803" class="t" font-size="13">interests chart, QR code + citation on every story</text>
  <text x="76" y="823" class="t" font-size="13">Emailed with the PDF every morning at 7:00 (PKT)</text>

  <!-- A <-> B -->
  <path d="M492 440 H566" class="arrow" marker-start="url(#a)" marker-end="url(#a)" />
  <text x="529" y="426" text-anchor="middle" class="m" font-size="11.5">HTTPS</text>
  <text x="529" y="462" text-anchor="middle" class="m" font-size="11.5">JSON +</text>
  <text x="529" y="477" text-anchor="middle" class="m" font-size="11.5">login token</text>

  <!-- ===== Column B: the API ===== -->
  <rect x="568" y="168" width="560" height="682" rx="16" class="col" />
  <text x="590" y="198" class="k" font-size="11">SERVER</text>
  <text x="590" y="226" class="h2" font-size="24">API · FastAPI on Render</text>
  <text x="590" y="248" class="m" font-size="13">Python 3.13 · checks each request's Supabase login · one paper per reader</text>

  <rect x="586" y="266" width="524" height="300" rx="10" class="sub" />
  <text x="604" y="292" class="b" font-size="15">Newsroom pipeline (about a minute per paper)</text>
  <g>
    <circle cx="616" cy="322" r="12" class="num" /><text x="616" y="327" text-anchor="middle" class="w" font-size="13">1</text>
    <text x="640" y="319" class="b" font-size="13.5">Gather</text>
    <text x="640" y="337" class="t" font-size="12.5">Google News RSS per interest + BBC, Verge, Ars · last 48 h · no repeats</text>
    <circle cx="616" cy="374" r="12" class="num" /><text x="616" y="379" text-anchor="middle" class="w" font-size="13">2</text>
    <text x="640" y="371" class="b" font-size="13.5">Rank</text>
    <text x="640" y="389" class="t" font-size="12.5">interest weight × freshness × source · max 6 a topic · 1 "new" per 10</text>
    <circle cx="616" cy="426" r="12" class="num" /><text x="616" y="431" text-anchor="middle" class="w" font-size="13">3</text>
    <text x="640" y="423" class="b" font-size="13.5">Links &amp; pictures</text>
    <text x="640" y="441" class="t" font-size="12.5">real publisher link · news photo → Wikipedia photo → Vale illustration</text>
    <circle cx="616" cy="478" r="12" class="num" /><text x="616" y="483" text-anchor="middle" class="w" font-size="13">4</text>
    <text x="640" y="475" class="b" font-size="13.5">Write (Gemini)</text>
    <text x="640" y="493" class="t" font-size="12.5">headline, summary, why it matters to you, 6 quiz questions, 3 takeaways</text>
    <circle cx="616" cy="530" r="12" class="num" /><text x="616" y="535" text-anchor="middle" class="w" font-size="13">5</text>
    <text x="640" y="527" class="b" font-size="13.5">Edition</text>
    <text x="640" y="545" class="t" font-size="12.5">20 stories in 2 parts · 1 morning paper + 2 extra a day, then it stops</text>
  </g>

  <rect x="586" y="578" width="524" height="110" rx="10" class="hot" />
  <text x="604" y="604" class="b" font-size="15">Learning engine: every action teaches it</text>
  <text x="604" y="627" class="t" font-size="13">read +2 · like +2 · skip −3 (undo +3) · quiz right +1 · Editor chat ±5</text>
  <text x="604" y="647" class="t" font-size="13">→ interest &amp; source weights → tomorrow's ranking (step 2)</text>
  <text x="604" y="667" class="t" font-size="13">Explains itself: "Why this story?" and the Brain panel</text>
  <path d="M1112 640 C1150 640 1150 374 1114 374" class="arrow" marker-end="url(#a)" />

  <rect x="586" y="700" width="256" height="132" rx="10" class="sub" />
  <text x="604" y="726" class="b" font-size="15">Printing press</text>
  <text x="604" y="749" class="t" font-size="12.5">PDF with ReportLab: cover,</text>
  <text x="604" y="768" class="t" font-size="12.5">index with page numbers,</text>
  <text x="604" y="787" class="t" font-size="12.5">interests chart, scannable</text>
  <text x="604" y="806" class="t" font-size="12.5">QR + citation per story</text>

  <rect x="854" y="700" width="256" height="132" rx="10" class="sub" />
  <text x="872" y="726" class="b" font-size="15">Morning job · 7:00 PKT</text>
  <text x="872" y="749" class="t" font-size="12.5">prints every reader's paper</text>
  <text x="872" y="768" class="t" font-size="12.5">and emails it with the PDF,</text>
  <text x="872" y="787" class="t" font-size="12.5">a signed 7-day link and</text>
  <text x="872" y="806" class="t" font-size="12.5">one-click unsubscribe</text>

  <!-- B -> C -->
  <path d="M1130 440 H1202" class="arrow" marker-end="url(#a)" />
  <text x="1166" y="426" text-anchor="middle" class="m" font-size="11.5">server</text>
  <text x="1166" y="462" text-anchor="middle" class="m" font-size="11.5">calls</text>

  <!-- ===== Column C: services ===== -->
  <rect x="1204" y="168" width="356" height="682" rx="16" class="col" />
  <text x="1226" y="198" class="k" font-size="11">SERVICES</text>
  <text x="1226" y="226" class="h2" font-size="24">Outside the app</text>
  <text x="1226" y="248" class="m" font-size="13">all free tiers</text>

  <rect x="1222" y="266" width="320" height="128" rx="10" class="svc" />
  <text x="1240" y="291" class="b" font-size="15">Supabase</text>
  <text x="1240" y="314" class="t" font-size="12.5">Auth: email sign-in links</text>
  <text x="1240" y="334" class="t" font-size="12.5">Postgres: vale_readers, one row per</text>
  <text x="1240" y="352" class="t" font-size="12.5">reader (RLS on, server-only access)</text>
  <text x="1240" y="373" class="t" font-size="12.5">Storage: story photos survive restarts</text>

  <rect x="1222" y="406" width="320" height="66" rx="10" class="svc" />
  <text x="1240" y="431" class="b" font-size="15">Google Gemini</text>
  <text x="1240" y="454" class="t" font-size="12.5">writes the paper as strict JSON</text>

  <rect x="1222" y="484" width="320" height="66" rx="10" class="svc" />
  <text x="1240" y="509" class="b" font-size="15">News sources</text>
  <text x="1240" y="532" class="t" font-size="12.5">Google News RSS · BBC · Verge · Ars</text>

  <rect x="1222" y="562" width="320" height="66" rx="10" class="svc" />
  <text x="1240" y="587" class="b" font-size="15">Wikipedia · icon services</text>
  <text x="1240" y="610" class="t" font-size="12.5">free photos · publisher logos</text>

  <rect x="1222" y="640" width="320" height="66" rx="10" class="svc" />
  <text x="1240" y="665" class="b" font-size="15">Brevo</text>
  <text x="1240" y="688" class="t" font-size="12.5">sends the morning email + PDF</text>

  <rect x="1222" y="718" width="320" height="56" rx="10" class="svc" />
  <text x="1240" y="742" class="b" font-size="15">Copilot Cloud</text>
  <text x="1240" y="762" class="t" font-size="12.5">runs the Editor chat agent</text>

  <rect x="1222" y="786" width="320" height="50" rx="10" class="svc" />
  <text x="1240" y="808" class="b" font-size="15">cron-job.org</text>
  <text x="1240" y="826" class="t" font-size="12.5">wakes the server 06:50, sends 07:00</text>

  <!-- ===== Daily loop ===== -->
  <rect x="40" y="878" width="1000" height="200" rx="16" class="col" />
  <text x="62" y="908" class="k" font-size="11">THE DAILY LOOP</text>
  <g>
    <rect x="62" y="928" width="140" height="66" rx="12" class="pill" />
    <text x="132" y="955" text-anchor="middle" class="b" font-size="13">07:00 wake-up</text>
    <text x="132" y="975" text-anchor="middle" class="m" font-size="12">cron-job.org</text>
    <path d="M204 961 H222" class="arrow" marker-end="url(#a)" />
    <rect x="224" y="928" width="140" height="66" rx="12" class="pill" />
    <text x="294" y="955" text-anchor="middle" class="b" font-size="13">Print the paper</text>
    <text x="294" y="975" text-anchor="middle" class="m" font-size="12">20 fresh stories</text>
    <path d="M366 961 H384" class="arrow" marker-end="url(#a)" />
    <rect x="386" y="928" width="140" height="66" rx="12" class="pill" />
    <text x="456" y="955" text-anchor="middle" class="b" font-size="13">Email + PDF</text>
    <text x="456" y="975" text-anchor="middle" class="m" font-size="12">to every student</text>
    <path d="M528 961 H546" class="arrow" marker-end="url(#a)" />
    <rect x="548" y="928" width="140" height="66" rx="12" class="pill" />
    <text x="618" y="955" text-anchor="middle" class="b" font-size="13">Read to the end</text>
    <text x="618" y="975" text-anchor="middle" class="m" font-size="12">feed or print</text>
    <path d="M690 961 H708" class="arrow" marker-end="url(#a)" />
    <rect x="710" y="928" width="140" height="66" rx="12" class="pill" />
    <text x="780" y="955" text-anchor="middle" class="b" font-size="13">Like · skip · quiz</text>
    <text x="780" y="975" text-anchor="middle" class="m" font-size="12">signals</text>
    <path d="M852 961 H870" class="arrow" marker-end="url(#a)" />
    <rect x="872" y="928" width="148" height="66" rx="12" class="pill" />
    <text x="946" y="955" text-anchor="middle" class="b" font-size="13">Weights update</text>
    <text x="946" y="975" text-anchor="middle" class="m" font-size="12">tomorrow is better</text>
    <path d="M946 996 V1040 H132 V998" class="arrow" marker-end="url(#a)" />
    <text x="540" y="1060" text-anchor="middle" class="m" font-size="12.5">tomorrow's paper is ranked with what you taught Vale today</text>
  </g>

  <!-- ===== Principles ===== -->
  <rect x="1060" y="878" width="500" height="200" rx="16" class="col" />
  <text x="1082" y="908" class="k" font-size="11">WHY IT ISN'T DOOMSCROLLING</text>
  <text x="1082" y="936" class="t" font-size="13.5">• Finite: 20 stories, then "You're all caught up"</text>
  <text x="1082" y="961" class="t" font-size="13.5">• A Brain check every 10 stories so the news sticks</text>
  <text x="1082" y="986" class="t" font-size="13.5">• No like counts, no autoplay, nothing loads after the end</text>
  <text x="1082" y="1011" class="t" font-size="13.5">• 1 morning paper + 2 extras a day, then "see you tomorrow"</text>
  <text x="1082" y="1036" class="t" font-size="13.5">• Every story cites its source (QR code in print)</text>
  <text x="1082" y="1061" class="t" font-size="13.5">• Learns interests openly: "Why this story?" for each one</text>

  <text x="800" y="1104" text-anchor="middle" class="m" font-size="12">React 19 · Vite · Tailwind · CopilotKit · FastAPI · Gemini · ReportLab · Supabase · Brevo · Render</text>
</svg>
</body>
</html>
