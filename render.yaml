# Render blueprint for Vale: the API (vale-api) and the website (vale-web).
# Render -> New -> Blueprint -> pick this repo. Values marked sync: false are asked for
# on the first deploy; see docs/DEPLOY.md for what goes where.
services:
  - type: web
    name: vale-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_IMAGES_BUCKET
        value: vale-images
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Vale
      # The website (vale-web) address, e.g. https://vale-web.onrender.com
      - key: PUBLIC_APP_URL
        sync: false
      # Same as PUBLIC_APP_URL (comma-separate more than one)
      - key: ALLOWED_ORIGINS
        sync: false
      # PUBLIC_API_URL is optional here: Render gives this service RENDER_EXTERNAL_URL.
      - key: DAILY_EMAIL_HOUR
        value: "7"
      - key: DAILY_EMAIL_TIMEZONE
        value: Asia/Karachi
      - key: DAILY_EMAIL_ENABLED
        value: "true"
      - key: MAX_EXTRA_EDITIONS_PER_DAY
        value: "2"
      - key: LINK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

  # The website: a free static site built from frontend/ (no server, served from Render's CDN).
  - type: web
    name: vale-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # One-page app: every path loads index.html (sign-in links come back to /).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # The API (vale-api) address, e.g. https://vale-api-ab12.onrender.com (no trailing slash)
      - key: VITE_API_BASE
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_COPILOTKIT_PUBLIC_API_KEY
        sync: false
      - key: VITE_AUTH_GOOGLE
        value: "false"
